<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:620},&quot;team&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;p1&quot;,&quot;p2&quot;],&quot;default&quot;:&quot;p1&quot;,&quot;tsType&quot;:&quot;'p1'|'p2'&quot;},&quot;flip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  bobRef = React.createRef(); headRef = React.createRef(); earRef = React.createRef();
  trunkRef = React.createRef(); riderRef = React.createRef();
  componentDidMount() {
    const t0 = performance.now() + (this.props.phase ?? 0) * 1000;
    const step = () => {
      if (this.props.animate ?? true) {
        const t = (performance.now() - t0) / 1000, s = Math.sin(t * 2.4), s2 = Math.sin(t * 2.4 - .6);
        this.bobRef.current?.setAttribute('transform', `translate(0 ${(s * 3).toFixed(2)})`);
        this.headRef.current?.setAttribute('transform', `rotate(${(s2 * 1.2).toFixed(2)} 520 330)`);
        this.earRef.current?.setAttribute('transform', `rotate(${(Math.sin(t * 1.7) * 4).toFixed(2)} 522 210)`);
        this.trunkRef.current?.setAttribute('transform', `rotate(${(Math.sin(t * 2.4 - 1.2) * 3).toFixed(2)} 664 360)`);
        this.riderRef.current?.setAttribute('transform', `translate(0 ${(s2 * 2).toFixed(2)})`);
      }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const p2 = this.props.team === 'p2';
    const c = p2
      ? { skin:'#8e4c7c', skinD:'#3a1232', skinL:'#f0b6dc', line:'#24081e', far:'#64305a', farD:'#260a20', inner:'#ffa6c4', cloth:'#2e9c86', clothD:'#0f4a3f', clothL:'#7fe8cf' }
      : { skin:'#6d78db', skinD:'#262a72', skinL:'#c2ccff', line:'#16184a', far:'#4a50a6', farD:'#1c1f58', inner:'#e2a8f0', cloth:'#d23b44', clothD:'#721320', clothL:'#ff8a8e' };
    const bez = (p, t) => { const u = 1 - t; return [0, 1].map(k => u*u*u*p[0][k] + 3*u*u*t*p[1][k] + 3*u*t*t*p[2][k] + t*t*t*p[3][k]); };
    const r = n => n.toFixed(1);
    const tassels = [];
    const hem = [[244, 398], [300, 418], [420, 416], [481, 394]];
    for (let i = 0; i < 9; i++) {
      const [x, y] = bez(hem, (i + .5) / 9);
      tassels.push({ d: `M ${r(x - 5)} ${r(y + 3)} L ${r(x + 5)} ${r(y + 3)} L ${r(x + 2)} ${r(y + 16)} L ${r(x - 2)} ${r(y + 16)} Z`, x: r(x), y: r(y + 19) });
    }
    const rivets = [];
    const bands = [[[300, 214], [288, 260], [286, 302], [292, 346]], [[422, 212], [434, 258], [436, 300], [430, 344]]];
    for (const b of bands) for (const t of [.18, .42, .66]) { const [x, y] = bez(b, t); rivets.push({ x: r(x), y: r(y), hx: r(x - 1.4), hy: r(y - 1.4) }); }
    for (const t of [.1, .3, .7, .9]) { const [x, y] = bez([[226, 338], [296, 354], [420, 352], [488, 328]], t); rivets.push({ x: r(x), y: r(y), hx: r(x - 1.4), hy: r(y - 1.4) }); }
    const spears = [-58, -46, -34, -22].map((a, i) => {
      const t = a * Math.PI / 180, dx = Math.sin(t), dy = -Math.cos(t), px = -dy, py = dx;
      const x0 = 470, y0 = 240, L = 150 - i * 6, x1 = x0 + L * dx, y1 = y0 + L * dy;
      return {
        shaft: `M ${x0} ${y0} L ${r(x1)} ${r(y1)}`,
        tip: `M ${r(x1 + px * 5)} ${r(y1 + py * 5)} C ${r(x1 + px * 6 + dx * 10)} ${r(y1 + py * 6 + dy * 10)}, ${r(x1 + dx * 22)} ${r(y1 + dy * 22)}, ${r(x1 + dx * 26)} ${r(y1 + dy * 26)} C ${r(x1 + dx * 22)} ${r(y1 + dy * 22)}, ${r(x1 - px * 6 + dx * 10)} ${r(y1 - py * 6 + dy * 10)}, ${r(x1 - px * 5)} ${r(y1 - py * 5)} Z`,
        tas: `M ${r(x1 - dx * 2)} ${r(y1 - dy * 2)} C ${r(x1 - dx * 8 - px * 10)} ${r(y1 - dy * 8 - py * 10)}, ${r(x1 - dx * 18 - px * 8)} ${r(y1 - dy * 18 - py * 8)}, ${r(x1 - dx * 22 - px * 2)} ${r(y1 - dy * 22 - py * 2)} C ${r(x1 - dx * 14)} ${r(y1 - dy * 14)}, ${r(x1 - dx * 8)} ${r(y1 - dy * 8)}, ${r(x1 - dx * 2)} ${r(y1 - dy * 2)} Z`
      };
    });
    return {
      c, tassels, rivets, spears,
      flipT: this.props.flip ? 'translate(980 0) scale(-1 1)' : '',
      glaiveT: '',
      plumeD: 'M 490 80 C 470 70, 448 76, 434 92 C 446 90, 452 94, 446 104 C 460 96, 470 98, 466 110 C 478 98, 488 92, 492 84 Z',
      bobRef: this.bobRef, headRef: this.headRef, earRef: this.earRef, trunkRef: this.trunkRef, riderRef: this.riderRef
    };
  }
}
